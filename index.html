<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16151A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>모루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">
<style>
:root{
  --ink:#16151A;
  --ink-2:#1E1C24;
  --ink-3:#2A2733;
  --line:#3A3644;
  --paper:#EDE6D6;
  --paper-line:#C9BFA6;
  --text:#E4E0D8;
  --muted:#8B8578;
  --verdigris:#6BA292;
  --verdigris-dim:#3E6459;
  --brass:#C9A961;
  --rust:#B8674A;
  --serif:'Gowun Batang', serif;
  --sans:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;
  display:flex;flex-direction:column;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
textarea{resize:vertical}

/* ---- shell ---- */
header{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--ink) 70%, transparent);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  display:flex;align-items:baseline;gap:10px;
}
header .mark{font-family:var(--serif);font-size:21px;letter-spacing:.14em;color:var(--paper)}
header .sub{font-size:11px;color:var(--muted);letter-spacing:.08em}
header .spacer{flex:1}
header .act{font-size:13px;color:var(--verdigris);padding:4px 2px}
main{flex:1;overflow-y:auto;padding:0 18px 28px;-webkit-overflow-scrolling:touch}
nav{
  display:flex;border-top:1px solid var(--line);background:var(--ink-2);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:11px 0 9px;font-size:11px;color:var(--muted);letter-spacing:.06em;
  border-top:2px solid transparent;margin-top:-1px}
nav button .g{display:block;font-family:var(--serif);font-size:17px;margin-bottom:2px;color:var(--muted)}
nav button[aria-current="true"]{color:var(--paper)}
nav button[aria-current="true"] .g{color:var(--verdigris)}
nav button[aria-current="true"]{border-top-color:var(--verdigris)}

/* ---- shared ---- */
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);margin:22px 0 10px}
.empty{border:1px dashed var(--line);border-radius:3px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-size:15px;margin-bottom:6px;font-weight:400}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:14px 15px;margin-bottom:9px;display:block;width:100%;text-align:left}
.card h3{margin:0 0 3px;font-family:var(--serif);font-weight:400;font-size:17px;color:var(--paper)}
.card p{margin:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tag{font-size:10.5px;color:var(--verdigris);letter-spacing:.06em}
.btn{display:block;width:100%;padding:13px;border-radius:3px;background:var(--verdigris-dim);color:#EAF5F1;
  font-size:14px;letter-spacing:.04em;border:1px solid var(--verdigris)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--rust);border-color:#5A3830}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px}
.row .btn{flex:1}
label.f{display:block;margin:14px 0 0}
label.f span{display:block;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:5px}
label.f input,label.f textarea,label.f select{
  width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:3px;
  padding:10px 11px;color:var(--text);outline:none}
label.f input:focus,label.f textarea:focus,label.f select:focus{border-color:var(--verdigris)}
label.f .hint{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:60;
  background:var(--ink-3);border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:3px;font-size:13px;max-width:88vw;text-align:center}
.err{border-color:#5A3830;color:#E8B4A2}

/* ---- world sheet (the manuscript) ---- */
.sheet{
  background:var(--paper);color:#2A2620;border-radius:2px;
  padding:22px 20px 24px;margin:4px 0 14px;
  box-shadow:0 1px 0 #A99A7C, 0 14px 30px rgba(0,0,0,.45);
  font-family:var(--serif);
}
.sheet .title{font-size:24px;line-height:1.3;margin:0 0 2px;font-weight:700}
.sheet .oneline{font-size:13.5px;color:#5C5545;margin:0 0 18px;font-family:var(--sans)}
.sheet .fld{border-top:1px solid var(--paper-line);padding-top:11px;margin-top:14px}
.sheet .fld > span{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;color:#8A7F63;margin-bottom:6px}
.sheet textarea,.sheet input{
  width:100%;background:transparent;border:none;outline:none;color:#2A2620;
  font-family:var(--serif);font-size:15px;line-height:1.75;padding:0;
}
.sheet textarea::placeholder,.sheet input::placeholder{color:#B0A588}
.sheet .note{font-family:var(--sans);font-size:11px;color:#8A7F63;margin-top:4px}

/* ---- harness ---- */
.harness{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:16px 15px;margin-bottom:14px}
.harness .total{font-family:var(--serif);font-size:15px;color:var(--paper);margin:0 0 14px;line-height:1.65}
.axis{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.axis:first-of-type{border-top:none;padding-top:0;margin-top:0}
.axis .head{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.axis .nm{font-size:13.5px;color:var(--paper);flex:1}
.pips{display:flex;gap:3px}
.pip{width:13px;height:3px;background:var(--ink-3);border-radius:1px}
.pip.on{background:var(--brass)}
.pip.on.low{background:var(--rust)}
.axis .dx{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.axis .fix{font-family:var(--serif);font-size:13.5px;background:var(--ink);border-left:2px solid var(--verdigris);
  padding:9px 11px;color:var(--text);border-radius:0 3px 3px 0}
.axis .apply{margin-top:7px;font-size:11.5px;color:var(--verdigris);letter-spacing:.06em;
  border:1px solid var(--verdigris-dim);border-radius:3px;padding:6px 11px}
.axis .apply[data-done="1"]{color:var(--muted);border-color:var(--line)}

/* ---- chat ---- */
.chatwrap{display:flex;flex-direction:column;height:100%}
.statebar{
  font-family:var(--mono);font-size:11px;line-height:1.55;
  background:var(--ink-2);border:1px solid var(--line);border-radius:3px;
  margin:2px 0 14px;overflow:hidden;
}
.statebar .sb-head{display:flex;align-items:center;gap:8px;padding:9px 12px;color:var(--verdigris);letter-spacing:.08em}
.statebar .sb-head .dot{width:5px;height:5px;border-radius:50%;background:var(--verdigris)}
.statebar .sb-head .chev{margin-left:auto;color:var(--muted)}
.statebar .sb-body{padding:0 12px 12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.statebar .sb-body b{color:var(--text);font-weight:400}
.statebar textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:3px;
  font-family:var(--mono);font-size:11px;padding:9px;min-height:150px;outline:none}
.msg{margin-bottom:16px;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.me{padding-left:26px}
.msg.me .body{background:var(--ink-3);border-radius:3px;padding:10px 13px;font-size:14.5px}
.msg.ai .who{font-family:var(--serif);font-size:12px;color:var(--brass);letter-spacing:.06em;margin-bottom:5px}
.msg.ai .body{font-size:15px;line-height:1.85;white-space:pre-wrap}
.msg.me .body{white-space:pre-wrap}
.msg.ai .body em{color:var(--muted);font-style:italic}
.composer{position:sticky;bottom:0;background:var(--ink);padding:8px 0 calc(env(safe-area-inset-bottom) + 6px)}
.composer .box{display:flex;gap:8px;align-items:flex-end;
  background:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:7px 8px 7px 11px}
.composer textarea{flex:1;background:none;border:none;outline:none;max-height:130px;min-height:24px;line-height:1.5;padding:3px 0}
.composer .send{width:34px;height:34px;border-radius:3px;background:var(--verdigris-dim);
  border:1px solid var(--verdigris);color:#EAF5F1;font-size:15px;flex:none}
.composer .tools{display:flex;gap:14px;padding:8px 3px 0;font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.thinking{color:var(--muted);font-size:13px;font-style:italic}

/* ---- 컨텍스트 게이지 ---- */
.ctx{margin:0 0 12px;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ctx .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.ctx .top .n{font-family:var(--mono)}
.ctx .top .fold{margin-left:auto;font-size:11px;padding:5px 10px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted)}
.ctx .top .fold[data-ready="1"]{border-color:var(--brass);color:var(--brass)}
.ctx .bar{height:3px;background:var(--ink-3);border-radius:2px;overflow:hidden}
.ctx .fill{height:100%;background:var(--verdigris-dim);transition:width .3s}
.ctx .fill[data-lv="warn"]{background:var(--brass)}
.ctx .fill[data-lv="over"]{background:var(--rust)}

/* ---- 지난 장면 ---- */
.eps{background:var(--ink-2);border:1px solid var(--line);border-radius:3px;margin:0 0 14px;overflow:hidden}
.eps .hd{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11px;
  color:var(--brass);letter-spacing:.08em;width:100%}
.eps .hd .chev{margin-left:auto;color:var(--muted)}
.eps .bd{padding:0 12px 10px}
.ep{border-top:1px solid var(--line);padding:10px 0 9px}
.ep:first-child{border-top:none}
.ep .r1{display:flex;align-items:baseline;gap:7px}
.ep .no{font-family:var(--mono);font-size:10.5px;color:var(--verdigris)}
.ep .ti{font-family:var(--serif);font-size:14px;color:var(--paper);flex:1;
  background:none;border:none;outline:none;border-bottom:1px solid transparent;padding:0}
.ep .ti:focus{border-bottom-color:var(--verdigris-dim)}
.ep .stars{display:flex;gap:2px}
.ep .stars button{font-size:12px;color:var(--ink-3);line-height:1}
.ep .stars button[data-on="1"]{color:var(--brass)}
.ep .kw{font-size:11px;color:var(--muted);margin-top:4px}
.ep .frag{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
.ep .rm{font-size:10.5px;color:var(--rust);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="mark">모루</div>
  <div class="sub" id="hsub"></div>
  <div class="spacer"></div>
  <button class="act" id="hact" hidden></button>
</header>

<main id="view"></main>

<nav>
  <button data-tab="worlds"><span class="g">世</span>세계</button>
  <button data-tab="chars"><span class="g">人</span>인물</button>
  <button data-tab="chats"><span class="g">話</span>대화</button>
  <button data-tab="settings"><span class="g">具</span>설정</button>
</nav>

<script>
/* ============================================================
   저장소
============================================================ */
const DB = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem('moru:'+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ localStorage.setItem('moru:'+k, JSON.stringify(v)); }
};
let S = {
  settings: DB.get('settings', {key:'', base:'https://api.deepseek.com', model:'deepseek-chat',
    keep:14, autostate:true, cap:9000, mark:6000, epcap:3}),
  worlds:   DB.get('worlds', []),
  chars:    DB.get('chars', []),
  chats:    DB.get('chats', []),
  seq:      DB.get('seq', 0),
  tab:'worlds', open:null, busy:false
};
const save = k => DB.set(k, S[k]);
const uid  = () => Math.random().toString(36).slice(2,10);
const esc  = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 인물 번호는 전역에서 한 번 매기고 다시 쓰지 않는다. 지운 인물의 번호는 공석으로 남는다. */
const nextNo = () => { S.seq = (S.seq||0) + 1; DB.set('seq', S.seq); return S.seq; };

/* 토큰 어림값. 정확한 값이 아니라 눈금용이다.
   영문·기호는 3.6자당 1토큰, 한글은 1자당 0.85토큰으로 잡았다. 실측으로 보정할 것. */
function estTok(s){
  s = String(s ?? ''); let a = 0, b = 0;
  for(let i = 0; i < s.length; i++){ s.charCodeAt(i) < 128 ? a++ : b++; }
  return Math.round(a / 3.6 + b * 0.85);
}

/* 이전 판 기록 맞추기 */
(function migrate(){
  let a = false, b = false;
  S.chars.forEach(c=>{ if(!c.no){ c.no = nextNo(); a = true; } });
  S.chats.forEach(ch=>{ if(!Array.isArray(ch.eps)){ ch.eps = []; b = true; } if(ch.cut == null){ ch.cut = 0; b = true; } });
  const st = S.settings;
  if(st.cap == null){ st.cap = 9000; st.mark = 6000; st.epcap = 3; DB.set('settings', st); }
  if(a) save('chars'); if(b) save('chats');
})();

function toast(msg, isErr){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr?' err':'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), isErr?5200:2400);
}

/* ============================================================
   모델 호출
============================================================ */
async function llm(messages, opt={}){
  const st = S.settings;
  if(!st.key) throw new Error('설정 탭에서 API 키를 먼저 넣어주세요.');
  const body = {
    model: st.model, messages,
    temperature: opt.temperature ?? 0.9,
    stream: !!opt.onDelta
  };
  if(opt.json) body.response_format = {type:'json_object'};
  let res;
  try{
    res = await fetch(st.base.replace(/\/$/,'') + '/chat/completions', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+st.key},
      body: JSON.stringify(body)
    });
  }catch(e){
    throw new Error('서버에 닿지 못했습니다. 브라우저가 직접 호출을 막는 경우(CORS)라 설정 탭의 주소를 프록시로 바꿔야 합니다.');
  }
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('모델이 요청을 거절했습니다 ('+res.status+'). '+t.slice(0,160));
  }
  if(!opt.onDelta){
    const d = await res.json();
    return d.choices?.[0]?.message?.content ?? '';
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf='', full='';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const p = line.slice(5).trim();
      if(!p || p === '[DONE]') continue;
      try{
        const j = JSON.parse(p);
        const d = j.choices?.[0]?.delta?.content;
        if(d){ full += d; opt.onDelta(full); }
      }catch(e){}
    }
  }
  return full;
}

function parseJSON(txt){
  const s = txt.indexOf('{'), e = txt.lastIndexOf('}');
  if(s < 0 || e < 0) throw new Error('모델이 형식에 맞지 않는 답을 보냈습니다. 다시 시도해 주세요.');
  return JSON.parse(txt.slice(s, e+1));
}

/* ============================================================
   세계 — 데이터 모양
============================================================ */
const FIELDS = [
  ['시대와장소','시대와 장소', 'line'],
  ['톤','톤과 분위기', 'line'],
  ['세계규칙','이 세계의 법칙', 'list'],
  ['갈등축','갈등의 축', 'list'],
  ['세력','세력  ―  이름 | 목표 | 부딪히는 것', 'list'],
  ['지역','장소  ―  이름 | 이곳의 특징', 'list'],
  ['감각디테일','감각의 결', 'list'],
  ['용어','이 세계의 말  ―  말 | 뜻', 'list']
];
const blankWorld = () => ({id:uid(), 제목:'', 기본설정:'', 한줄:'', 시대와장소:'', 톤:'',
  세계규칙:[], 갈등축:[], 세력:[], 지역:[], 감각디테일:[], 용어:[], harness:null, 만든날:Date.now()});

const asLines = v => Array.isArray(v)
  ? v.map(x => typeof x === 'string' ? x : Object.values(x).filter(Boolean).join(' | ')).join('\n')
  : String(v||'');
const fromLines = t => t.split('\n').map(s=>s.trim()).filter(Boolean);

function worldText(w){
  let out = `제목: ${w.제목}\n한 줄: ${w.한줄}\n시대와 장소: ${w.시대와장소}\n톤: ${w.톤}\n`;
  for(const [k,label] of FIELDS){
    if(k==='시대와장소'||k==='톤') continue;
    const l = asLines(w[k]);
    if(l) out += `\n[${label.split('  ―')[0]}]\n${l}\n`;
  }
  return out.trim();
}
const 모순축 = [['원하는것','원하는 것'],['실은필요한것','실은 필요한 것'],['두려운것','두려운 것'],['자기기만','자기기만']];

function charText(c){
  let t = `번호: ${c.no ?? '-'}\n이름: ${c.이름}\n한 줄: ${c.한줄}\n성격: ${c.성격}\n말투: ${c.말투}\n배경: ${c.배경}`;
  const m = 모순축.filter(([k])=>c[k]).map(([k,l])=>`  - ${l}: ${c[k]}`);
  if(m.length) t += `\n안에서 부딪히는 것:\n${m.join('\n')}`;
  if(c.예시대사) t += `\n예시 대사:\n${c.예시대사}`;
  return t;
}

/* ============================================================
   세계 생성 · 견고성 점검
============================================================ */
const AXES = ['갈등축','제약','세력 균형','감각','판돈','미해결','톤 일관성','고유한 말'];

async function buildWorld(w){
  const sys = `너는 인터랙티브 소설의 세계를 짓는 조력자다. 사용자가 준 제목과 메모를 읽고, 이야기를 굴릴 수 있을 만큼 구체적인 세계를 만든다.
지켜야 할 것:
- 사용자의 메모에 있는 것은 절대 바꾸지 말고, 빈 곳만 채운다.
- 추상어를 피한다. "혼란스러운 시대"가 아니라 무엇이 어떻게 무너졌는지 쓴다.
- 규칙에는 반드시 "할 수 없는 일"을 넣는다. 무엇이든 가능한 세계는 긴장이 없다.
- 세력은 목표가 서로 부딪히도록 짠다.
- 감각디테일은 눈·귀·코·살갗으로 잡히는 것만 쓴다.
- 한국어로 쓴다.
아래 형태의 JSON만 출력한다. 설명이나 마크다운 없이 JSON 하나만:
{"한줄":"","시대와장소":"","톤":"","세계규칙":["",""],"갈등축":["",""],"세력":[{"이름":"","목표":"","부딪히는것":""}],"지역":[{"이름":"","특징":""}],"감각디테일":["",""],"용어":[{"말":"","뜻":""}]}
세계규칙 4~6개, 갈등축 2~3개, 세력 3개, 지역 3~4개, 감각디테일 4~5개, 용어 4~6개.`;
  const usr = `제목: ${w.제목}\n\n메모:\n${w.기본설정}` +
    (worldText(w).length > 60 ? `\n\n이미 정해진 것(바꾸지 말 것):\n${worldText(w)}` : '');
  const j = parseJSON(await llm([{role:'system',content:sys},{role:'user',content:usr}], {json:true, temperature:1.0}));
  Object.assign(w, {
    한줄:j.한줄||w.한줄, 시대와장소:j.시대와장소||w.시대와장소, 톤:j.톤||w.톤,
    세계규칙:j.세계규칙||[], 갈등축:j.갈등축||[],
    세력:(j.세력||[]).map(x=>`${x.이름} | ${x.목표} | ${x.부딪히는것||''}`),
    지역:(j.지역||[]).map(x=>`${x.이름} | ${x.특징}`),
    감각디테일:j.감각디테일||[],
    용어:(j.용어||[]).map(x=>`${x.말} | ${x.뜻}`)
  });
  return w;
}

async function runHarness(w){
  const sys = `너는 세계관을 점검하는 편집자다. 아래 세계가 몰입할 만한 이야기를 굴릴 수 있는지 축별로 본다.
축과 그 뜻:
- 갈등축: 무엇이 무엇과 부딪히는지 분명한가
- 제약: 할 수 없는 일이 분명한가
- 세력 균형: 이해가 다른 집단이 둘 이상 있고 힘이 한쪽으로 쏠리지 않는가
- 감각: 눈·귀·코로 잡히는 구체가 있는가
- 판돈: 이야기의 주인공이 잃을 것이 있는가
- 미해결: 아직 답이 없는 질문이 남아 있는가
- 톤 일관성: 정해둔 것들이 하나의 온도를 유지하는가
- 고유한 말: 이 세계에서만 통하는 이름과 말이 있는가
점수는 0~5. 후하게 주지 말고, 부족하면 낮게 준다.
보완은 그대로 세계 설정에 붙여 넣을 수 있는 완성된 한 문장으로 쓴다. 이미 충분한 축이면 보완은 빈 문자열로 둔다.
반영칸은 다음 중 하나: 세계규칙, 갈등축, 세력, 지역, 감각디테일, 용어. 세력은 "이름 | 목표 | 부딪히는것", 지역은 "이름 | 특징", 용어는 "말 | 뜻" 형식으로 보완을 쓴다.
한국어. JSON만 출력:
{"총평":"","축":[{"이름":"갈등축","점수":3,"진단":"","보완":"","반영칸":"갈등축"}]}
축은 위 여덟 개를 모두 포함한다.`;
  const j = parseJSON(await llm([{role:'system',content:sys},{role:'user',content:worldText(w)}], {json:true, temperature:0.4}));
  w.harness = j; return w;
}

/* ============================================================
   대화 — 프롬프트 조립
============================================================ */
const blankState = () => ({장면:'', 시각:'', 인물:[], 주인공평판:'', 최근사건:[], 미해결:[], 소지:[]});

/* 인물 상태는 세계 상태 안에 함께 둔다.
   따로 떼면 갱신 호출이 하나 더 늘어나는데, 에피소드 요약 호출이 이미 붙어 있어
   턴당 호출이 셋을 넘어간다. 합친 JSON이 커져 정확도가 떨어지면 그때 분리한다. */
function stateText(st){
  const L = [];
  if(st.장면) L.push(`장면: ${st.장면}`);
  if(st.시각) L.push(`시각: ${st.시각}`);
  if(st.인물?.length) L.push('인물:\n' + st.인물.map(p=>{
    const head = [p.상태, p.태도 && '태도 '+p.태도, p.감정 && '감정 '+p.감정,
      (p.경계도 !== '' && p.경계도 != null) && '경계 '+p.경계도].filter(Boolean).join(' / ');
    let s = `  - [${p.번호 ?? '-'}] ${p.이름}: ${head}`;
    if(p.관계단계) s += `\n      주인공을 보는 자리: ${p.관계단계}` + (p.근거에피 ? ` (근거 ${p.근거에피})` : '');
    if(p.장면목표) s += `\n      이 장면에서 얻어내려는 것: ${p.장면목표}`;
    if(p.방금받은인상) s += `\n      방금 받은 인상: ${p.방금받은인상}`;
    return s;
  }).join('\n'));
  if(st.주인공평판) L.push(`주인공을 보는 눈: ${st.주인공평판}`);
  if(st.최근사건?.length) L.push('벌어진 일:\n' + st.최근사건.map(x=>`  - ${x}`).join('\n'));
  if(st.미해결?.length) L.push('아직 안 풀린 것:\n' + st.미해결.map(x=>`  - ${x}`).join('\n'));
  if(st.소지?.length) L.push(`지닌 것: ${st.소지.join(', ')}`);
  return L.join('\n') || '(아직 없음)';
}

/* ============================================================
   지난 장면 — 접어 둔 에피소드
   상태가 "지금 어떤가"를 들고 있다면, 에피소드는 "그때 무슨 일이 있었나"를 들고 있다.
   상태만으로는 "언제 봤는데?"에 답할 수 없어서 따로 둔다.
============================================================ */
const nextEpNo = chat => (chat.eps?.length ? Math.max(...chat.eps.map(e=>e.no)) : 0) + 1;
const epName = n => { const c = S.chars.find(x=>x.no===n); return c ? c.이름 : `#${n}`; };

function epLine(e){
  const k = e.급소?.length ? ` · 급소 ${e.급소.join(', ')}` : '';
  const p = e.인물?.length ? ` · 인물 ${e.인물.join(',')}` : '';
  return `[에피${e.no}] ${e.제목}${p}${k}`;
}
function epFull(e){
  const frag = (e.조각||[]).map(f=>`    · ${f.상대!=null?`[${f.상대}] `:''}${f.요약}`).join('\n');
  return epLine(e) + (frag ? '\n' + frag : '');
}

/* 지금 장면에 있는 인물, 그리고 별표를 단 인물이 나오는 에피소드만 펼친다.
   나머지는 한 줄 제목만 남긴다 — 모델이 목록을 훑고 필요하면 스스로 알아본다. */
function epsText(chat, openCap){
  if(!chat.eps?.length) return '';
  const active = new Set((chat.state?.인물||[]).map(p=>p.번호).filter(n=>n!=null));
  S.chars.filter(c=>c.pin).forEach(c=> active.add(c.no));
  const rel = chat.eps.filter(e => e.인물?.some(n => active.has(n)));
  rel.sort((a,b)=> (b.중요도||1)-(a.중요도||1) || b.no-a.no);
  const open = new Set(rel.slice(0, Math.max(0, openCap)).map(e=>e.no));
  return chat.eps.map(e => open.has(e.no) ? epFull(e) : epLine(e)).join('\n');
}

/* ============================================================
   프롬프트 조립 — 캐시가 걸리도록 고정과 변동을 가른다
   DeepSeek 캐시는 0번째 토큰부터 프리픽스가 그대로여야 걸린다.
   그래서 매 턴 바뀌는 블록(상태·지난 장면)은 대화 기록보다도 뒤,
   마지막 발화 바로 앞에 끼운다. 앞의 규칙·세계·인물과 과거 턴이 통째로 프리픽스가 된다.
============================================================ */
function buildFixed(chat){
  const w = S.worlds.find(x=>x.id===chat.worldId);
  const c = S.chars.find(x=>x.id===chat.charId);
  return `너는 인터랙티브 소설을 진행한다. 아래 인물을 연기하고, 그 인물이 없는 장면은 서술자로 이어간다.

━ 반드시 지킬 것 ━
1. 뒤에 오는 "지금 상태"가 가장 최신 사실이다. 앞선 대화 기록과 어긋나면 상태 쪽을 따른다.
2. 상태에 죽었다고 적힌 인물은 다시 등장하지 않는다. 다친 인물은 다친 채로 움직인다.
3. 사용자가 보여준 힘·평판·앞선 행동은 주변 인물의 반응에 반드시 반영한다. 압도당한 쪽이 아무 일 없었다는 듯 덤비지 않는다.
4. 사용자의 대사나 행동을 대신 쓰지 않는다. 사용자 차례에서 멈춘다.
5. 갈등을 억지로 만들지 않는다. 상황이 조용하면 조용한 채로 둔다.
6. 인물의 "안에서 부딪히는 것"은 대놓고 설명하지 않는다. 가끔 자기기만이 말끝에서 새어나오게 한다.
7. 인물마다 "이 장면에서 얻어내려는 것"이 있으면 그것을 향해 움직인다. 연설만 하지 않는다.
8. 말투의 뼈대(어미, 자주 쓰는 말)는 유지하되, 감정에 따라 온도는 흔들려도 된다.
9. "지난 장면"에 적힌 것은 실제로 있었던 일이다. 흐름에 맞을 때만 구체적으로 꺼낸다 — 매번 꺼내면 부자연스럽다.
10. 지난 장면 목록에 없는 과거를 확정된 사실처럼 말하지 않는다. 기억이 흐리면 인물이 얼버무리게 둔다.
11. 서술은 *별표* 사이에, 대사는 그냥 쓴다. 사용자 입력이 짧으면 3문장 안팎, 장면이 바뀌면 6문장까지. 한국어.

━ 세계 ━
${w ? worldText(w) : '(세계 없음)'}

━ 연기할 인물 ━
${c ? charText(c) : '(인물 없음)'}`;
}

function buildLive(chat, openCap){
  let t = `━ 지금 상태 ━\n${stateText(chat.state)}`;
  const eps = epsText(chat, openCap);
  if(eps) t += `\n\n━ 지난 장면 ━\n${eps}`;
  return t;
}

const ctxCost = msgs => msgs.reduce((a,m)=> a + estTok(m.content) + 4, 0);

/* 원문 잘라내기는 한 턴씩 미는 대신 계단으로 내린다.
   한 칸씩 밀면 매 턴 프리픽스가 깨져 캐시가 전혀 걸리지 않는다. */
function stepCut(chat){
  const keep = Number(S.settings.keep) || 14;
  const slack = Math.max(4, Math.ceil(keep/2));
  if(chat.cut == null) chat.cut = 0;
  if(chat.msgs.length - chat.cut > keep + slack){
    chat.cut = Math.max(chat.cut, chat.msgs.length - keep);
    return true;
  }
  return false;
}

function assemble(chat){
  const cap = Number(S.settings.cap) || 9000;
  let openCap = Number(S.settings.epcap) || 3;
  const moved = stepCut(chat);
  const build = ()=>{
    const hist = chat.msgs.slice(chat.cut).map(m=>({role:m.role, content:m.content}));
    const live = {role:'system', content: buildLive(chat, openCap)};
    const head = {role:'system', content: buildFixed(chat)};
    if(!hist.length) return [head, live];
    return [head, ...hist.slice(0,-1), live, hist[hist.length-1]];
  };
  let msgs = build(), n = ctxCost(msgs), trimmed = false;
  while(n > cap && openCap > 0){ openCap--; msgs = build(); n = ctxCost(msgs); trimmed = true; }
  while(n > cap && chat.msgs.length - chat.cut > 4){ chat.cut += 2; msgs = build(); n = ctxCost(msgs); trimmed = true; }
  return {msgs, tokens:n, trimmed, moved};
}

/* 눈금용. 실제로 보낼 것과 같은 방식으로 재되, 호출은 하지 않는다. */
function ctxPeek(chat){
  const cap = Number(S.settings.cap) || 9000;
  const openCap = Number(S.settings.epcap) || 3;
  const hist = chat.msgs.slice(chat.cut ?? 0).map(m=>({role:m.role, content:m.content}));
  const msgs = [{role:'system', content: buildFixed(chat)}, ...hist,
                {role:'system', content: buildLive(chat, openCap)}];
  return {tokens: ctxCost(msgs), cap};
}

async function updateState(chat){
  const ep = nextEpNo(chat);
  const roster = S.chars.filter(c=>c.no).map(c=>`${c.no}=${c.이름}`).join(', ') || '(없음)';
  const sys = `너는 이야기의 현재 상태를 기록한다. 기존 상태와 방금 오간 대화를 읽고, 갱신된 상태 전체를 JSON으로 낸다.
- 바뀌지 않은 항목은 그대로 옮겨 적는다. 빠뜨리면 기억이 사라진다.
- 인물의 죽음·부상·태도 변화는 반드시 반영한다.
- 인물 번호는 아래 번호표를 그대로 쓴다. 번호표에 없는 인물은 번호를 비운다.
- 관계단계는 경멸·흥미·인정·의존 가운데 어디쯤인지와 최근 움직인 방향을 함께 적는다.
- 관계단계가 이번 대화에서 움직였다면 근거에피에 "에피${ep}"라고 적는다. 움직이지 않았으면 이전 값을 그대로 둔다.
  (지금 벌어진 일은 아직 장면으로 접히지 않았으므로 다음 번호를 가리킨다.)
- 경계도는 0~5. 장면목표는 그 인물이 이 장면에서 얻어내려는 것 한 줄.
- 최근사건은 최대 6개, 오래된 것부터 지운다. 판을 뒤집은 사건은 남긴다.
- 주인공평판에는 주변 인물이 주인공을 어떻게 보는지 한 줄로 적는다.
- 한국어. JSON만:
{"장면":"","시각":"","인물":[{"이름":"","번호":0,"상태":"","태도":"","감정":"","경계도":0,"관계단계":"","장면목표":"","방금받은인상":"","근거에피":""}],"주인공평판":"","최근사건":[],"미해결":[],"소지":[]}

인물 번호표: ${roster}`;
  const last = chat.msgs.slice(-4).map(m=>`${m.role==='user'?'사용자':'이야기'}: ${m.content}`).join('\n\n');
  const usr = `기존 상태:\n${JSON.stringify(chat.state, null, 1)}\n\n방금 오간 대화:\n${last}`;
  chat.state = parseJSON(await llm([{role:'system',content:sys},{role:'user',content:usr}], {json:true, temperature:0.2}));
}

/* 장면 접기 — 유저가 누를 때만 돈다.
   누가 눌렀다는 것 자체가 "이건 남길 만하다"는 표시라, 중요도를 따로 판정할 필요가 없다. */
async function foldScene(chat, 제목){
  const from = chat.cut ?? 0, to = chat.msgs.length;
  if(to - from < 2) throw new Error('접을 만큼 대화가 쌓이지 않았습니다.');
  const raw = chat.msgs.slice(from, to).map(m=>`${m.role==='user'?'사용자':'이야기'}: ${m.content}`).join('\n\n');
  const no = nextEpNo(chat);
  const roster = S.chars.filter(c=>c.no).map(c=>`${c.no}=${c.이름}`).join(', ') || '(없음)';
  const sys = `너는 이야기의 한 장면을 나중에 다시 꺼내 쓸 수 있게 접어 둔다.
- 대화 상대나 국면이 바뀌는 자리마다 조각으로 나눈다. 조각은 2~6개.
- 조각 요약은 무슨 일이 있었는지 한두 문장. 인물은 이름 대신 번호로 적는다.
- 급소: 나중에 이 장면을 되짚거나 놀릴 때 쓸 낱말 2~5개. 그 자리에서 실제로 쟁점이 된 말을 그대로 고른다.
  ("명예를 아느냐"로 붙었다면 급소는 "명예"다. 뜻이 비슷한 다른 말로 바꾸지 않는다.)
- 인물에는 이 장면에 실제로 있었던 인물의 번호만 넣는다. 이름만 스친 사람은 넣지 않는다.
- 제목은 12자 안쪽.
- 한국어. JSON만:
{"제목":"","인물":[1,2],"급소":["",""],"조각":[{"상대":1,"요약":""}]}

인물 번호표: ${roster}`;
  const j = parseJSON(await llm([{role:'system',content:sys},{role:'user',content:raw}], {json:true, temperature:0.3}));
  chat.eps.push({
    no, 제목: (제목||'').trim() || j.제목 || `장면 ${no}`,
    인물: (j.인물||[]).filter(n=>typeof n==='number'),
    급소: j.급소||[], 조각: j.조각||[],
    중요도: 1, 범위:[from,to], 만든날: Date.now()
  });
  /* 직전 왕복 하나는 남긴다 — 접자마자 대화가 뚝 끊긴 느낌을 막는다. */
  chat.cut = Math.max(from, to - 2);
  return chat.eps[chat.eps.length-1];
}

const view = document.getElementById('view');
const hsub = document.getElementById('hsub');
const hact = document.getElementById('hact');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.tab===S.tab)));
  hact.hidden = true; hact.onclick = null; hsub.textContent = '';
  ({worlds:vWorlds, chars:vChars, chats:vChats, settings:vSettings})[S.tab]();
}
function topAction(label, fn){ hact.hidden=false; hact.textContent=label; hact.onclick=fn; }
function go(tab, open){ S.tab=tab; S.open=open??null; view.scrollTop=0; render(); }

/* ---------- 세계 ---------- */
function vWorlds(){
  if(S.open){ return worldSheet(S.worlds.find(w=>w.id===S.open)); }
  hsub.textContent = '지은 세계';
  topAction('새 세계', ()=>{ const w=blankWorld(); S.worlds.unshift(w); save('worlds'); go('worlds', w.id); });
  view.innerHTML = S.worlds.length ? '' :
    `<div class="empty" style="margin-top:40px"><b>아직 세계가 없습니다</b>제목과 몇 줄의 메모만 있으면<br>나머지는 같이 채워 나갑니다.</div>`;
  S.worlds.forEach(w=>{
    const b = document.createElement('button'); b.className='card';
    b.innerHTML = `<h3>${esc(w.제목||'제목 없음')}</h3><p>${esc(w.한줄||w.기본설정||'아직 비어 있습니다')}</p>`
      + (w.harness ? `<div class="tag" style="margin-top:6px">견고성 ${w.harness.축.reduce((a,x)=>a+x.점수,0)} / 40</div>`:'');
    b.onclick = ()=> go('worlds', w.id);
    view.appendChild(b);
  });
}

function worldSheet(w){
  if(!w) return go('worlds');
  hsub.textContent = '세계';
  topAction('← 목록', ()=> go('worlds'));
  view.innerHTML = '';

  const sheet = document.createElement('div'); sheet.className='sheet';
  const ti = document.createElement('input');
  ti.className='title'; ti.value = w.제목; ti.placeholder='세계의 이름';
  ti.style.cssText='font-size:24px;font-weight:700;line-height:1.3;margin-bottom:2px';
  ti.oninput = ()=>{ w.제목 = ti.value; save('worlds'); };
  sheet.appendChild(ti);

  const one = document.createElement('input');
  one.className='oneline'; one.value = w.한줄; one.placeholder='한 줄로 말하면';
  one.style.cssText='font-family:var(--sans);font-size:13.5px;color:#5C5545;margin-bottom:14px';
  one.oninput = ()=>{ w.한줄 = one.value; save('worlds'); };
  sheet.appendChild(one);

  const memo = fld('처음 적은 메모', 'textarea', w.기본설정, v=>{ w.기본설정=v; save('worlds'); },
    '여기에 몇 줄만 적고 아래 단추를 누르면 나머지를 채웁니다.');
  sheet.appendChild(memo);

  FIELDS.forEach(([k,label,kind])=>{
    sheet.appendChild(fld(label, kind==='line'?'input':'textarea', kind==='line'? w[k] : asLines(w[k]),
      v=>{ w[k] = kind==='line' ? v : fromLines(v); save('worlds'); }));
  });
  view.appendChild(sheet);

  const gen = document.createElement('button');
  gen.className='btn'; gen.textContent='세부 설정 채우기';
  gen.onclick = async ()=>{
    if(!w.제목 && !w.기본설정) return toast('제목이나 메모를 먼저 적어주세요.', true);
    await guard(gen, '짓는 중…', async ()=>{ await buildWorld(w); save('worlds'); render(); toast('채웠습니다. 마음에 안 드는 곳은 직접 고치세요.'); });
  };
  view.appendChild(gen);

  const row = document.createElement('div'); row.className='row'; row.style.marginTop='8px';
  const chk = document.createElement('button');
  chk.className='btn ghost'; chk.textContent='견고성 점검';
  chk.onclick = ()=> guard(chk, '읽는 중…', async ()=>{ await runHarness(w); save('worlds'); render(); });
  row.appendChild(chk);
  const del = document.createElement('button');
  del.className='btn danger'; del.textContent='세계 지우기';
  del.onclick = ()=>{ if(confirm('이 세계를 지웁니다. 되돌릴 수 없습니다.')){
    S.worlds = S.worlds.filter(x=>x.id!==w.id); save('worlds'); go('worlds'); } };
  row.appendChild(del);
  view.appendChild(row);

  if(w.harness) view.appendChild(harnessEl(w));
}

function fld(label, tag, val, onInput, note){
  const d = document.createElement('div'); d.className='fld';
  const s = document.createElement('span'); s.textContent = label; d.appendChild(s);
  const el = document.createElement(tag);
  el.value = val || '';
  el.placeholder = tag==='textarea' ? '한 줄에 하나씩' : '—';
  if(tag==='textarea'){
    el.rows = Math.max(2, String(val||'').split('\n').length);
    el.style.overflow='hidden';
    const fit = ()=>{ el.style.height='auto'; el.style.height = el.scrollHeight+'px'; };
    setTimeout(fit, 0); el.addEventListener('input', fit);
  }
  el.addEventListener('input', ()=> onInput(el.value));
  d.appendChild(el);
  if(note){ const n=document.createElement('div'); n.className='note'; n.textContent=note; d.appendChild(n); }
  return d;
}

function harnessEl(w){
  const h = w.harness;
  const box = document.createElement('div'); box.className='harness';
  box.style.marginTop='16px';
  const total = h.축.reduce((a,x)=>a+x.점수,0);
  const eb = document.createElement('div'); eb.className='eyebrow'; eb.style.margin='0 0 10px';
  eb.textContent = `견고성  ${total} / 40`;
  box.appendChild(eb);
  const t = document.createElement('p'); t.className='total'; t.textContent = h.총평; box.appendChild(t);

  h.축.forEach((a, i)=>{
    const d = document.createElement('div'); d.className='axis';
    const pips = Array.from({length:5}, (_,n)=>
      `<div class="pip ${n < a.점수 ? 'on' : ''} ${a.점수<=2?'low':''}"></div>`).join('');
    d.innerHTML = `<div class="head"><div class="nm">${esc(a.이름)}</div><div class="pips">${pips}</div></div>
      <p class="dx">${esc(a.진단)}</p>`;
    if(a.보완){
      const f = document.createElement('div'); f.className='fix'; f.textContent = a.보완; d.appendChild(f);
      const ap = document.createElement('button'); ap.className='apply'; ap.textContent='세계에 반영';
      ap.onclick = ()=>{
        const key = FIELDS.some(([k])=>k===a.반영칸) ? a.반영칸 : '세계규칙';
        if(Array.isArray(w[key])) w[key] = [...w[key], a.보완]; else w[key] = (w[key]?w[key]+' ':'') + a.보완;
        save('worlds'); ap.dataset.done='1'; ap.textContent='반영했습니다';
        toast(`${key}에 넣었습니다.`);
      };
      d.appendChild(ap);
    }
    box.appendChild(d);
  });
  return box;
}

/* ---------- 인물 ---------- */
const blankChar = () => ({id:uid(), no:nextNo(), 이름:'', 한줄:'', 성격:'', 말투:'', 배경:'', 첫인사:'', 예시대사:'',
  원하는것:'', 실은필요한것:'', 두려운것:'', 자기기만:'', pin:false, worldId:''});

function vChars(){
  if(S.open){ return charSheet(S.chars.find(c=>c.id===S.open)); }
  hsub.textContent = '인물';
  topAction('새 인물', ()=>{ const c=blankChar(); S.chars.unshift(c); save('chars'); go('chars', c.id); });
  view.innerHTML = S.chars.length ? '' :
    `<div class="empty" style="margin-top:40px"><b>아직 인물이 없습니다</b>세계를 하나 고르고 이름만 정하면<br>나머지 초안은 만들어 드립니다.</div>`;
  S.chars.forEach(c=>{
    const w = S.worlds.find(x=>x.id===c.worldId);
    const b = document.createElement('button'); b.className='card';
    b.innerHTML = `<h3>${esc(c.이름||'이름 없음')}</h3><p>${esc(c.한줄||'아직 비어 있습니다')}</p>`
      + (w?`<div class="tag" style="margin-top:6px">${esc(w.제목)}</div>`:'');
    b.onclick = ()=> go('chars', c.id);
    view.appendChild(b);
  });
}

function charSheet(c){
  if(!c) return go('chars');
  hsub.textContent = '인물';
  topAction('← 목록', ()=> go('chars'));
  view.innerHTML = '';
  const F = [['이름','이름','input'],['한줄','한 줄로 말하면','input'],['성격','성격','textarea'],
    ['말투','말투','textarea'],['배경','배경','textarea'],
    ['원하는것','원하는 것  ―  의식해서 좇는 것','textarea'],
    ['실은필요한것','실은 필요한 것  ―  본인은 모르는 결핍','textarea'],
    ['두려운것','두려운 것  ―  절대 인정하지 않는 것','textarea'],
    ['자기기만','자기기만  ―  스스로에게 하는 거짓말 한 줄','textarea'],
    ['첫인사','첫 장면','textarea'],['예시대사','예시 대사','textarea']];

  const pin = document.createElement('button');
  pin.className = 'btn ghost';
  const paintPin = ()=>{ pin.textContent = (c.pin?'★':'☆') + '  중요 인물' + (c.pin?' (지난 장면을 늘 펼침)':''); 
    pin.style.color = c.pin ? 'var(--brass)' : 'var(--muted)'; };
  paintPin();
  pin.onclick = ()=>{ c.pin = !c.pin; save('chars'); paintPin(); };
  const noTag = document.createElement('div');
  noTag.style.cssText = 'font-family:var(--mono);font-size:11px;color:var(--muted);margin:2px 0 10px';
  noTag.textContent = `인물 번호 ${c.no ?? '-'} — 요약 안에서 이름 대신 쓰입니다`;
  view.appendChild(pin); view.appendChild(noTag);

  const ws = document.createElement('label'); ws.className='f';
  ws.innerHTML = `<span>속한 세계</span>`;
  const sel = document.createElement('select');
  sel.innerHTML = `<option value="">— 없음 —</option>` +
    S.worlds.map(w=>`<option value="${w.id}" ${w.id===c.worldId?'selected':''}>${esc(w.제목||'제목 없음')}</option>`).join('');
  sel.onchange = ()=>{ c.worldId = sel.value; save('chars'); };
  ws.appendChild(sel); view.appendChild(ws);

  F.forEach(([k,label,tag])=>{
    const l = document.createElement('label'); l.className='f';
    l.innerHTML = `<span>${label}</span>`;
    const el = document.createElement(tag);
    if(tag==='textarea') el.rows = k==='배경'||k==='첫인사' ? 4 : 3;
    el.value = c[k] || '';
    el.addEventListener('input', ()=>{ c[k]=el.value; save('chars'); });
    l.appendChild(el); view.appendChild(l);
  });

  const gen = document.createElement('button');
  gen.className='btn'; gen.textContent='초안 만들기'; gen.style.marginTop='18px';
  gen.onclick = ()=>{
    if(!c.이름 && !c.한줄) return toast('이름이나 한 줄 소개를 먼저 적어주세요.', true);
    guard(gen, '짓는 중…', async ()=>{
      const w = S.worlds.find(x=>x.id===c.worldId);
      const sys = `너는 인터랙티브 소설의 인물을 짓는다. 세계와 어울리되 납작하지 않게 만든다.
- 성격에는 반드시 약점이나 모순을 하나 넣는다.
- 말투는 흉내 낼 수 있게 구체적으로 쓴다. 어미, 자주 쓰는 말, 침묵하는 순간.
- 원하는것 / 실은필요한것 / 두려운것 / 자기기만 넷은 서로 부딪히게 짠다.
  원하는 것을 좇을수록 실은 필요한 것에서 멀어지도록, 두려운 것이 자기기만의 이유가 되도록.
- 자기기만은 인물이 스스로에게 하는 거짓말 한 줄. 말끝에서 새어나올 만한 문장으로 쓴다.
- 첫 장면은 사용자가 바로 끼어들 수 있는 상황으로, *서술*과 대사를 섞어 3~5문장.
- 예시 대사는 상황이 다른 세 줄.
- 한국어. JSON만: {"한줄":"","성격":"","말투":"","배경":"","원하는것":"","실은필요한것":"","두려운것":"","자기기만":"","첫인사":"","예시대사":""}`;
      const usr = (w?`세계:\n${worldText(w)}\n\n`:'') + `인물:\n${charText(c)}`;
      const j = parseJSON(await llm([{role:'system',content:sys},{role:'user',content:usr}], {json:true, temperature:1.0}));
      Object.assign(c, {한줄:j.한줄||c.한줄, 성격:j.성격, 말투:j.말투, 배경:j.배경,
        원하는것:j.원하는것||c.원하는것, 실은필요한것:j.실은필요한것||c.실은필요한것,
        두려운것:j.두려운것||c.두려운것, 자기기만:j.자기기만||c.자기기만,
        첫인사:j.첫인사, 예시대사:j.예시대사});
      save('chars'); render(); toast('만들었습니다. 고치고 싶은 곳은 바로 고치세요.');
    });
  };
  view.appendChild(gen);

  const row = document.createElement('div'); row.className='row'; row.style.marginTop='8px';
  const start = document.createElement('button');
  start.className='btn ghost'; start.textContent='이 인물과 대화 시작';
  start.onclick = ()=>{
    if(!c.이름) return toast('이름을 먼저 정해주세요.', true);
    const chat = {id:uid(), charId:c.id, worldId:c.worldId, 제목:c.이름, state:blankState(),
      msgs: c.첫인사 ? [{role:'assistant', content:c.첫인사}] : [], eps:[], cut:0, 연날:Date.now()};
    S.chats.unshift(chat); save('chats'); go('chats', chat.id);
  };
  row.appendChild(start);
  const del = document.createElement('button');
  del.className='btn danger'; del.textContent='인물 지우기';
  del.onclick = ()=>{ if(confirm('이 인물을 지웁니다.')){ S.chars=S.chars.filter(x=>x.id!==c.id); save('chars'); go('chars'); } };
  row.appendChild(del);
  view.appendChild(row);
}

/* ---------- 대화 ---------- */
function vChats(){
  if(S.open){ return chatView(S.chats.find(c=>c.id===S.open)); }
  hsub.textContent = '대화';
  view.innerHTML = S.chats.length ? '' :
    `<div class="empty" style="margin-top:40px"><b>아직 대화가 없습니다</b>인물 탭에서 인물을 고르고<br>대화 시작을 누르세요.</div>`;
  S.chats.forEach(ch=>{
    const c = S.chars.find(x=>x.id===ch.charId);
    const last = ch.msgs[ch.msgs.length-1];
    const b = document.createElement('button'); b.className='card';
    b.innerHTML = `<h3>${esc(c?.이름 || ch.제목)}</h3><p>${esc((last?.content||'아직 비어 있습니다').replace(/\*/g,''))}</p>
      <div class="tag" style="margin-top:6px">${ch.msgs.length}턴</div>`;
    b.onclick = ()=> go('chats', ch.id);
    view.appendChild(b);
  });
}

function chatView(chat){
  if(!chat) return go('chats');
  const c = S.chars.find(x=>x.id===chat.charId);
  hsub.textContent = c?.이름 || '대화';
  topAction('← 목록', ()=> go('chats'));
  view.innerHTML = '';

  /* 상태 패널 */
  const sb = document.createElement('div'); sb.className='statebar';
  const shown = DB.get('sbopen', false);
  sb.innerHTML = `<button class="sb-head" style="width:100%"><div class="dot"></div>지금 상태<div class="chev">${shown?'닫기':'보기'}</div></button>`;
  const body = document.createElement('div'); body.className='sb-body'; body.hidden = !shown;
  const paint = ()=>{ body.textContent = stateText(chat.state); };
  paint();
  const edit = document.createElement('button');
  edit.className='apply'; edit.style.cssText='margin-top:9px;font-size:11px;color:var(--verdigris);border:1px solid var(--verdigris-dim);border-radius:3px;padding:5px 10px';
  edit.textContent = '직접 고치기';
  edit.onclick = ()=>{
    const ta = document.createElement('textarea');
    ta.value = JSON.stringify(chat.state, null, 1);
    const ok = document.createElement('button');
    ok.className='apply'; ok.style.cssText=edit.style.cssText; ok.textContent='저장';
    ok.onclick = ()=>{ try{ chat.state = JSON.parse(ta.value); save('chats'); body.innerHTML=''; paint(); body.appendChild(edit); toast('고쳤습니다.'); }
      catch(e){ toast('JSON 형식이 맞지 않습니다.', true); } };
    body.innerHTML=''; body.appendChild(ta); body.appendChild(ok);
  };
  body.appendChild(edit);
  sb.querySelector('.sb-head').onclick = ()=>{
    body.hidden = !body.hidden; DB.set('sbopen', !body.hidden);
    sb.querySelector('.chev').textContent = body.hidden ? '보기' : '닫기';
  };
  sb.appendChild(body);
  view.appendChild(sb);

  /* 컨텍스트 게이지 — 얼마나 쌓였고, 접을 때가 됐는지 */
  const ctx = document.createElement('div'); ctx.className='ctx';
  ctx.innerHTML = `<div class="top"><span class="n"></span><span class="tail"></span>
    <button class="fold">장면 접기</button></div><div class="bar"><div class="fill"></div></div>`;
  const ctxN = ctx.querySelector('.n'), ctxTail = ctx.querySelector('.tail');
  const ctxFill = ctx.querySelector('.fill'), foldBtn = ctx.querySelector('.fold');
  const paintCtx = ()=>{
    const {tokens, cap} = ctxPeek(chat);
    const mark = Number(S.settings.mark) || Math.round(cap*0.7);
    const pct = Math.min(100, Math.round(tokens/cap*100));
    ctxN.textContent = `≈ ${tokens.toLocaleString()} / ${cap.toLocaleString()} 토큰`;
    ctxTail.textContent = chat.eps.length ? `· 접어 둔 장면 ${chat.eps.length}` : '';
    ctxFill.style.width = pct + '%';
    ctxFill.dataset.lv = tokens >= cap ? 'over' : tokens >= mark ? 'warn' : '';
    const ready = tokens >= mark;
    foldBtn.dataset.ready = ready ? '1' : '0';
    foldBtn.disabled = (chat.msgs.length - (chat.cut??0)) < 2;
    foldBtn.textContent = ready ? '장면 접기 ●' : '장면 접기';
  };
  view.appendChild(ctx);

  /* 지난 장면 */
  const epw = document.createElement('div'); epw.className='eps';
  const epOpen = DB.get('epopen', false);
  epw.innerHTML = `<button class="hd">지난 장면<span class="chev">${epOpen?'닫기':'보기'}</span></button>`;
  const epBody = document.createElement('div'); epBody.className='bd'; epBody.hidden = !epOpen;
  const paintEps = ()=>{
    epBody.innerHTML = '';
    if(!chat.eps.length){
      epBody.innerHTML = `<div style="font-size:11.5px;color:var(--muted);padding:4px 0 6px">
        아직 접어 둔 장면이 없습니다. 대화가 쌓이면 위의 「장면 접기」로 남기세요.</div>`;
      return;
    }
    chat.eps.slice().reverse().forEach(e=>{
      const d = document.createElement('div'); d.className='ep';
      const r1 = document.createElement('div'); r1.className='r1';
      r1.innerHTML = `<span class="no">에피${e.no}</span>`;
      const ti = document.createElement('input'); ti.className='ti'; ti.value = e.제목;
      ti.addEventListener('input', ()=>{ e.제목 = ti.value; save('chats'); });
      r1.appendChild(ti);
      const st = document.createElement('div'); st.className='stars';
      [1,2,3].forEach(n=>{
        const b = document.createElement('button'); b.textContent='★';
        b.dataset.on = (e.중요도||1) >= n ? '1' : '0';
        b.onclick = ()=>{ e.중요도 = n; save('chats'); paintEps(); paintCtx(); };
        st.appendChild(b);
      });
      r1.appendChild(st); d.appendChild(r1);
      if(e.급소?.length){
        const k = document.createElement('div'); k.className='kw';
        k.textContent = '급소  ' + e.급소.join(' · ') +
          (e.인물?.length ? '     인물  ' + e.인물.map(epName).join(', ') : '');
        d.appendChild(k);
      }
      (e.조각||[]).forEach(f=>{
        const g = document.createElement('div'); g.className='frag';
        g.textContent = `— ${f.상대!=null?`[${epName(f.상대)}] `:''}${f.요약}`;
        d.appendChild(g);
      });
      const rm = document.createElement('button'); rm.className='rm'; rm.textContent='이 장면 지우기';
      rm.onclick = ()=>{ if(confirm(`에피${e.no} "${e.제목}"을 지웁니다.`)){
        chat.eps = chat.eps.filter(x=>x.no!==e.no); save('chats'); paintEps(); paintCtx(); } };
      d.appendChild(rm);
      epBody.appendChild(d);
    });
  };
  paintEps();
  epw.querySelector('.hd').onclick = ()=>{
    epBody.hidden = !epBody.hidden; DB.set('epopen', !epBody.hidden);
    epw.querySelector('.chev').textContent = epBody.hidden ? '보기' : '닫기';
  };
  epw.appendChild(epBody);
  view.appendChild(epw);

  foldBtn.onclick = ()=>{
    const 제목 = prompt('이 장면의 제목 (비우면 알아서 붙입니다)') ?? null;
    if(제목 === null) return;
    guard(foldBtn, '접는 중…', async ()=>{
      const e = await foldScene(chat, 제목);
      save('chats'); paintEps(); paintCtx(); drawMsgs();
      if(epBody.hidden){ epBody.hidden = false; DB.set('epopen', true); epw.querySelector('.chev').textContent='닫기'; }
      toast(`에피${e.no} 「${e.제목}」으로 접었습니다.`);
    });
  };

  /* 메시지 */
  const list = document.createElement('div'); view.appendChild(list);
  const drawMsgs = ()=>{
    list.innerHTML = '';
    chat.msgs.forEach(m=> list.appendChild(msgEl(m, c)));
  };
  drawMsgs();

  /* 입력 */
  const comp = document.createElement('div'); comp.className='composer';
  comp.innerHTML = `<div class="box"><textarea rows="1" placeholder="무엇을 합니까"></textarea><button class="send">↑</button></div>
    <div class="tools"><button id="t-undo">되감기</button><button id="t-regen">다시 쓰기</button><button id="t-sync">상태 새로 읽기</button><button id="t-del" style="margin-left:auto;color:var(--rust)">대화 지우기</button></div>`;
  view.appendChild(comp);
  const ta = comp.querySelector('textarea'), sendBtn = comp.querySelector('.send');
  ta.addEventListener('input', ()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,130)+'px'; });

  const scroll = ()=> view.scrollTo({top: view.scrollHeight, behavior:'smooth'});

  async function turn(){
    if(S.busy) return;
    const text = ta.value.trim(); if(!text) return;
    ta.value=''; ta.style.height='auto';
    chat.msgs.push({role:'user', content:text});
    save('chats'); drawMsgs(); scroll();
    await respond(false);
  }

  async function respond(regen){
    S.busy = true; sendBtn.disabled = true;
    const holder = document.createElement('div'); holder.className='msg ai';
    holder.innerHTML = `<div class="who">${esc(c?.이름||'이야기')}</div><div class="body thinking">쓰는 중…</div>`;
    list.appendChild(holder); scroll();
    const bodyEl = holder.querySelector('.body');
    try{
      const {msgs, trimmed} = assemble(chat);
      if(trimmed) toast('컨텍스트 상한에 걸려 옛 원문을 줄였습니다. 장면을 접어 두세요.');
      const out = await llm(msgs,
        {temperature:0.95, onDelta: t=>{ bodyEl.classList.remove('thinking'); bodyEl.innerHTML = fmt(t); scroll(); }});
      chat.msgs.push({role:'assistant', content: out});
      save('chats'); drawMsgs();
      if(S.settings.autostate){
        try{ await updateState(chat); save('chats'); paint(); body.appendChild(edit); }
        catch(e){ toast('상태를 갱신하지 못했습니다. 대화는 그대로 이어집니다.', true); }
      }
      paintCtx();
    }catch(e){
      holder.remove(); toast(e.message, true);
    }finally{ S.busy=false; sendBtn.disabled=false; scroll(); }
  }

  sendBtn.onclick = turn;
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !/Mobi/.test(navigator.userAgent)){ e.preventDefault(); turn(); } });

  comp.querySelector('#t-undo').onclick = ()=>{
    while(chat.msgs.length && chat.msgs[chat.msgs.length-1].role==='assistant') chat.msgs.pop();
    if(chat.msgs.length && chat.msgs[chat.msgs.length-1].role==='user') ta.value = chat.msgs.pop().content;
    if(chat.cut > chat.msgs.length) chat.cut = Math.max(0, chat.msgs.length - 2);
    save('chats'); drawMsgs(); paintCtx(); toast('한 걸음 되돌렸습니다.');
  };
  comp.querySelector('#t-regen').onclick = ()=>{
    if(S.busy) return;
    while(chat.msgs.length && chat.msgs[chat.msgs.length-1].role==='assistant') chat.msgs.pop();
    save('chats'); drawMsgs(); respond(true);
  };
  comp.querySelector('#t-sync').onclick = async (e)=>{
    await guard(e.target, '읽는 중…', async ()=>{ await updateState(chat); save('chats'); paint(); body.appendChild(edit); paintCtx(); toast('상태를 다시 읽었습니다.'); });
  };
  paintCtx();
  comp.querySelector('#t-del').onclick = ()=>{
    if(confirm('이 대화를 지웁니다. 되돌릴 수 없습니다.')){ S.chats = S.chats.filter(x=>x.id!==chat.id); save('chats'); go('chats'); }
  };
  setTimeout(scroll, 60);
}

const fmt = t => esc(t).replace(/\*([^*]+)\*/g, '<em>$1</em>');
function msgEl(m, c){
  const d = document.createElement('div');
  d.className = 'msg ' + (m.role==='user'?'me':'ai');
  d.innerHTML = m.role==='user'
    ? `<div class="body">${esc(m.content)}</div>`
    : `<div class="who">${esc(c?.이름||'이야기')}</div><div class="body">${fmt(m.content)}</div>`;
  return d;
}

/* ---------- 설정 ---------- */
function vSettings(){
  hsub.textContent = '설정';
  const st = S.settings;
  view.innerHTML = `
    <label class="f"><span>API 키</span><input id="s-key" type="password" placeholder="sk-…" value="${esc(st.key)}">
      <div class="hint">이 기기에만 저장됩니다. 서버로 보내지 않습니다.</div></label>
    <label class="f"><span>주소</span><input id="s-base" value="${esc(st.base)}">
      <div class="hint">브라우저가 직접 호출을 막으면 프록시 주소로 바꾸세요.</div></label>
    <label class="f"><span>모델</span><input id="s-model" value="${esc(st.model)}"></label>
    <label class="f"><span>원문으로 넘길 최근 턴</span><input id="s-keep" type="number" min="4" max="40" value="${st.keep}">
      <div class="hint">이보다 오래된 일은 상태 기록과 접어 둔 장면이 대신 기억합니다.
      한 턴씩 밀어내지 않고 절반쯤 여유가 찼을 때 한 번에 줄입니다 — 그래야 캐시가 걸립니다.</div></label>
    <label class="f"><span>턴당 컨텍스트 상한</span><input id="s-cap" type="number" min="2000" max="60000" step="500" value="${st.cap}">
      <div class="hint">어림 토큰 기준. 넘으면 펼친 장면을 먼저 접고, 그래도 넘으면 옛 원문을 줄입니다.</div></label>
    <label class="f"><span>장면 접기를 권할 지점</span><input id="s-mark" type="number" min="1000" max="60000" step="500" value="${st.mark}">
      <div class="hint">여기를 넘으면 대화 화면의 「장면 접기」에 불이 들어옵니다.</div></label>
    <label class="f"><span>한 번에 펼칠 지난 장면</span><input id="s-epcap" type="number" min="0" max="8" value="${st.epcap}">
      <div class="hint">지금 자리에 있는 인물, 별표를 단 인물이 나오는 장면부터 펼칩니다. 나머지는 제목만 갑니다.</div></label>
    <label class="f"><span>상태 자동 기록</span>
      <select id="s-auto"><option value="1" ${st.autostate?'selected':''}>켜기</option><option value="0" ${!st.autostate?'selected':''}>끄기</option></select>
      <div class="hint">매 턴 한 번 더 호출합니다. 끄면 값은 싸지고 기억은 흐려집니다.</div></label>
    <div class="eyebrow">기록</div>
    <div class="row"><button class="btn ghost" id="s-out">내보내기</button><button class="btn ghost" id="s-in">가져오기</button></div>
    <p style="font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.7">
      모든 기록은 이 브라우저 안에만 있습니다. 브라우저 저장소를 비우면 함께 사라지니 가끔 내보내 두세요.</p>`;
  const bind = (id,k,f=(v=>v)) => { const el=document.getElementById(id);
    el.addEventListener('input', ()=>{ st[k]=f(el.value); save('settings'); });
    el.addEventListener('change', ()=>{ st[k]=f(el.value); save('settings'); }); };
  bind('s-key','key'); bind('s-base','base'); bind('s-model','model');
  bind('s-keep','keep', v=>Number(v)); bind('s-auto','autostate', v=>v==='1');
  bind('s-cap','cap', v=>Number(v)); bind('s-mark','mark', v=>Number(v)); bind('s-epcap','epcap', v=>Number(v));

  document.getElementById('s-out').onclick = ()=>{
    const blob = new Blob([JSON.stringify({worlds:S.worlds, chars:S.chars, chats:S.chats, seq:S.seq}, null, 1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `모루-${new Date().toISOString().slice(0,10)}.json`; a.click();
  };
  document.getElementById('s-in').onclick = ()=>{
    const i = document.createElement('input'); i.type='file'; i.accept='.json';
    i.onchange = async ()=>{
      try{
        const j = JSON.parse(await i.files[0].text());
        S.worlds = j.worlds||[]; S.chars = j.chars||[]; S.chats = j.chats||[];
        S.seq = j.seq || Math.max(0, ...S.chars.map(c=>c.no||0));
        S.chars.forEach(c=>{ if(!c.no) c.no = nextNo(); });
        S.chats.forEach(ch=>{ if(!Array.isArray(ch.eps)) ch.eps=[]; if(ch.cut==null) ch.cut=0; });
        DB.set('seq', S.seq);
        save('worlds'); save('chars'); save('chats'); toast('가져왔습니다.'); render();
      }catch(e){ toast('파일을 읽지 못했습니다.', true); }
    };
    i.click();
  };
}

/* ---------- 공통 ---------- */
async function guard(btn, label, fn){
  if(S.busy) return;
  S.busy = true; const old = btn.textContent; btn.textContent = label; btn.disabled = true;
  try{ await fn(); }
  catch(e){ toast(e.message, true); }
  finally{ S.busy=false; btn.disabled=false; if(btn.isConnected) btn.textContent = old; }
}

document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> go(b.dataset.tab));
render();
</script>
</body>
</html>
